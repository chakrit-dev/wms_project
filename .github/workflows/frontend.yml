name: build_and_deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: ./wms_frontend  # ✅ ตรวจชื่อโฟลเดอร์ให้ถูก

      - name: Build Vite Project with Production Env
        run: npm run build
        working-directory: ./wms_frontend  # ✅ ต้องตรงกับที่มี package.json

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/wms_frontend"     # ✅ โฟลเดอร์ frontend
          output_location: "dist"
